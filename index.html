<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Capital 360 — Venta de vivienda en el Valle de Aburrá</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f8f8; --text: #16211f;
    --muted: #5a6b68; --accent: #0f7d72; --line: #dde5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101615; --surface: #18211f; --text: #e8efed;
      --muted: #9db0ac; --accent: #4cc4b4; --line: #27332f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  .brand {
    font-size: 13px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 16px;
  }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 16px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  a.btn {
    display: inline-block; padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--text); text-decoration: none; font-size: 15px;
  }
  a.btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Hub Capital 360</p>
  <h1>Te ayudo a vender o a encontrar tu propiedad</h1>
  <p>Compraventa de casas y apartamentos en el Valle de Aburrá, Antioquia.</p>
  <div class="links">
    <a class="btn" href="mailto:hubcapital360@gmail.com">hubcapital360@gmail.com</a>
    <a class="btn" href="./privacidad.html">Política de datos personales</a>
  </div>
</div>
</body>
</html>
